<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Moodly Test</title>
  <style>
    body { font-family: monospace; font-size: 13px; background: #111; color: #eee; display: flex; height: 100vh; overflow: hidden; }
    #left  { width: 180px; border-right: 1px solid #333; overflow-y: auto; padding: 8px 0; }
    #mid   { width: 280px; border-right: 1px solid #333; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    #right { flex: 1; padding: 12px; overflow-y: auto; }
    .group { font-size: 0.65rem; text-transform: uppercase; color: #555; padding: 8px 10px 2px; }
    .act   { display: block; width: 100%; text-align: left; padding: 5px 10px; background: none; border: none; color: #aaa; font: inherit; cursor: pointer; }
    .act:hover  { color: #eee; background: #1a1a1a; }
    .act.active { color: #FFD600; }
    label  { display: block; font-size: 0.75rem; color: #888; margin-bottom: 2px; }
    input, textarea  { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 5px 7px; font: inherit; }
    textarea { resize: vertical; min-height: 48px; }
    #send  { padding: 7px; background: #FFD600; color: #000; border: none; font: inherit; font-weight: 700; cursor: pointer; }
    #send:disabled { opacity: 0.4; cursor: default; }
    #out   { white-space: pre-wrap; font-size: 0.78rem; line-height: 1.5; background: #1a1a1a; border: 1px solid #333; padding: 10px; min-height: 200px; }
    .k { color: #a78bfa; } .s { color: #4ade80; } .n { color: #FFD600; } .b { color: #fb923c; } .z { color: #f87171; }
    h1 { font-size: 0.85rem; padding: 0 10px 8px; border-bottom: 1px solid #333; margin-bottom: 6px; color: #FFD600; }
    #action-label { font-weight: 700; color: #eee; }
    #action-desc  { font-size: 0.72rem; color: #666; }
    #status { font-size: 0.78rem; }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>

<div id="left">
  <h1>Actions</h1>
  <div class="group">Auth</div>
  <button class="act" onclick="pick('register')">register</button>
  <button class="act" onclick="pick('login')">login</button>
  <button class="act" onclick="pick('logout')">logout</button>
  <button class="act" onclick="pick('check_session')">check_session</button>
  <div class="group">Users</div>
  <button class="act" onclick="pick('discover')">discover</button>
  <button class="act" onclick="pick('search_users')">search_users</button>
  <button class="act" onclick="pick('get_profile')">get_profile</button>
  <button class="act" onclick="pick('update_profile')">update_profile</button>
  <div class="group">Interests</div>
  <button class="act" onclick="pick('get_interests')">get_interests</button>
  <button class="act" onclick="pick('search_interests')">search_interests</button>
  <button class="act" onclick="pick('find_or_create_interest')">find_or_create_interest</button>
  <button class="act" onclick="pick('set_interests')">set_interests</button>
  <div class="group">Connections</div>
  <button class="act" onclick="pick('send_request')">send_request</button>
  <button class="act" onclick="pick('accept_request')">accept_request</button>
  <button class="act" onclick="pick('reject_request')">reject_request</button>
  <button class="act" onclick="pick('get_connections')">get_connections</button>
  <div class="group">Events</div>
  <button class="act" onclick="pick('get_events')">get_events</button>
  <button class="act" onclick="pick('create_event')">create_event</button>
  <button class="act" onclick="pick('invite_to_event')">invite_to_event</button>
  <button class="act" onclick="pick('accept_event')">accept_event</button>
  <button class="act" onclick="pick('decline_event')">decline_event</button>
  <button class="act" onclick="pick('cancel_event')">cancel_event</button>
  <button class="act" onclick="pick('delete_event')">delete_event</button>
  <button class="act" onclick="pick('get_map_events')">get_map_events</button>
  <div class="group">Chat</div>
  <button class="act" onclick="pick('get_chats')">get_chats</button>
  <button class="act" onclick="pick('get_messages')">get_messages</button>
  <button class="act" onclick="pick('send_message')">send_message</button>
  <button class="act" onclick="pick('get_event_messages')">get_event_messages</button>
  <button class="act" onclick="pick('send_event_message')">send_event_message</button>
  <div class="group">Reports</div>
  <button class="act" onclick="pick('report_user')">report_user</button>
  <div class="group">Admin</div>
  <button class="act" onclick="pick('admin_get_users')">admin_get_users</button>
  <button class="act" onclick="pick('admin_ban')">admin_ban</button>
  <button class="act" onclick="pick('admin_stats')">admin_stats</button>
  <button class="act" onclick="pick('admin_get_reports')">admin_get_reports</button>
  <button class="act" onclick="pick('admin_resolve_report')">admin_resolve_report</button>
</div>

<div id="mid">
  <div id="action-label">—</div>
  <div id="action-desc"></div>
  <div id="fields"></div>
  <button id="send" onclick="send()" disabled>Send</button>
  <div id="status"></div>
</div>

<div id="right">
  <div id="out">← pick an action</div>
</div>

<script>
const API = 'api/api.php';
let current = null;

// action → { description, method, fields }
// every action has a userId field so you can run as any user without logging in
const DEFS = {
  register:               { m:'POST', d:'Create account.',                        f:['name','email','password'] },
  login:                  { m:'POST', d:'Log in (sets server session).',           f:['email','password'] },
  logout:                 { m:'POST', d:'End session.',                            f:[] },
  check_session:          { m:'GET',  d:'Check active session.',                   f:[] },
  discover:               { m:'GET',  d:'Suggested users.',                        f:[] },
  search_users:           { m:'GET',  d:'Search by name.',                         f:['q'] },
  get_profile:            { m:'GET',  d:'Profile. Leave targetId blank for self.', f:['targetId?'] },
  update_profile:         { m:'POST', d:'Update own name.',                        f:['name'] },
  get_interests:          { m:'GET',  d:'All categories and tags.',                f:[] },
  search_interests:       { m:'GET',  d:'Search tags. Optional: categoria',        f:['q','categoria?'] },
  find_or_create_interest:{ m:'POST', d:'Find or create tag in a category.',       f:['name','categoria?'] },
  set_interests:          { m:'POST', d:'Set interests. tags = JSON array of IDs e.g. [1,3,7]', f:['tags'] },
  send_request:           { m:'POST', d:'Send connection request.',                f:['targetId'] },
  accept_request:         { m:'POST', d:'Accept a pending request.',               f:['requestId'] },
  reject_request:         { m:'POST', d:'Reject a pending request.',               f:['requestId'] },
  get_connections:        { m:'GET',  d:'Connections + pending received.',         f:[] },
  get_events:             { m:'GET',  d:'Events for this user.',                   f:[] },
  create_event:           { m:'POST', d:'Create event.',                           f:['title','description?','location?','lat?','lng?','date'] },
  invite_to_event:        { m:'POST', d:'Invite connection to event (creator).',   f:['eventId','inviteeId'] },
  accept_event:           { m:'POST', d:'Accept event invite.',                    f:['eventId'] },
  decline_event:          { m:'POST', d:'Decline or leave event.',                 f:['eventId'] },
  cancel_event:           { m:'POST', d:'Cancel event (creator).',                 f:['eventId'] },
  delete_event:           { m:'POST', d:'Delete cancelled event (creator).',       f:['eventId'] },
  get_map_events:         { m:'GET',  d:'Events with coordinates.',                f:[] },
  get_chats:              { m:'GET',  d:'All direct chats.',                       f:[] },
  get_messages:           { m:'GET',  d:'Messages in a chat.',                     f:['connectionId'] },
  send_message:           { m:'POST', d:'Send to a direct chat.',                  f:['connectionId','message'] },
  get_event_messages:     { m:'GET',  d:'Event group chat messages.',              f:['eventId'] },
  send_event_message:     { m:'POST', d:'Send to event group chat.',               f:['eventId','message'] },
  report_user:            { m:'POST', d:'Report a user.',                          f:['reportedId','reason'] },
  admin_get_users:        { m:'GET',  d:'[Admin] All users.',                      f:[] },
  admin_ban:              { m:'POST', d:'[Admin] banned=1 ban, banned=0 unban.',   f:['targetId','banned'] },
  admin_stats:            { m:'GET',  d:'[Admin] Platform stats.',                 f:[] },
  admin_get_reports:      { m:'GET',  d:'[Admin] All reports.',                    f:[] },
  admin_resolve_report:   { m:'POST', d:'[Admin] status = reviewed|dismissed',    f:['reportId','status'] },
};

function pick(action) {
  current = action;
  const def = DEFS[action];

  document.querySelectorAll('.act').forEach(b => b.classList.remove('active'));
  document.querySelector(`.act[onclick="pick('${action}')"]`)?.classList.add('active');
  document.getElementById('action-label').textContent = action + ' [' + def.m + ']';
  document.getElementById('action-desc').textContent  = def.d;
  document.getElementById('send').disabled = false;
  document.getElementById('status').textContent = '';

  // Always show userId at the top — this is the "who is sending" field
  const allFields = ['userId', ...def.f];

  document.getElementById('fields').innerHTML = allFields.map(f => {
    const opt  = f.endsWith('?');
    const name = opt ? f.slice(0, -1) : f;
    const big  = ['message','reason','description','tags'].includes(name);
    return `<div style="margin-bottom:8px;">
      <label>${name === 'userId' ? 'userId (who is sending)' : name}${opt ? ' — optional' : ''}</label>
      ${big
        ? `<textarea id="f-${name}" placeholder="${name}"></textarea>`
        : `<input id="f-${name}" type="text" placeholder="${name}"/>`
      }
    </div>`;
  }).join('');
}

async function send() {
  if (!current) return;
  const def = DEFS[current];

  const allFields = ['userId', ...def.f];
  const data = {};
  allFields.forEach(f => {
    const name = f.endsWith('?') ? f.slice(0,-1) : f;
    const el   = document.getElementById('f-' + name);
    if (el?.value.trim()) data[name] = el.value.trim();
  });

  const btn = document.getElementById('send');
  btn.disabled = true;
  btn.textContent = '...';

  let json;
  try {
    let url = API, opts = { method: def.m };
    if (def.m === 'POST') {
      const fd = new FormData();
      fd.append('action', current);
      Object.entries(data).forEach(([k,v]) => fd.append(k, v));
      opts.body = fd;
    } else {
      url += '?' + new URLSearchParams({ action: current, ...data });
    }
    json = await (await fetch(url, opts)).json();
  } catch(e) {
    json = { ok: false, error: String(e) };
  }

  btn.disabled = false;
  btn.textContent = 'Send';

  const statusEl = document.getElementById('status');
  statusEl.textContent = json.ok ? '✓ ok' : '✗ ' + json.error;
  statusEl.className   = json.ok ? 'ok' : 'err';

  document.getElementById('out').innerHTML = highlight(JSON.stringify(json, null, 2));
}

function highlight(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g, m => {
      if (/^"/.test(m)) return /:$/.test(m) ? `<span class="k">${m}</span>` : `<span class="s">${m}</span>`;
      if (/true|false/.test(m)) return `<span class="b">${m}</span>`;
      if (/null/.test(m)) return `<span class="z">${m}</span>`;
      return `<span class="n">${m}</span>`;
    });
}
</script>
</body>
</html>
